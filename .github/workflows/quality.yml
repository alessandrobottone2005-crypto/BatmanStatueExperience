name: Quality and browser regression
on:
  push:
    branches: [main, codex/audit-remediation]
  pull_request:
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: ./node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run --auto-servernum npm run test:e2e -- --headed --project=${{ matrix.browser }}
        env:
          CI: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-regression-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
